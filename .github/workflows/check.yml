name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: olimpyx
          POSTGRES_PASSWORD: olimpyx-local-only
          POSTGRES_DB: olimpyx
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U olimpyx"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate deployment Compose file
        run: docker compose config --quiet
      - name: Build production images
        run: |
          docker build --target server --tag olimpyx-server:ci .
          docker build --target web --tag olimpyx-web:ci .
      - run: npx playwright install --with-deps chromium
      - name: Start API and web
        run: |
          npm run dev:server > /tmp/olimpyx-api.log 2>&1 &
          npm run dev -w @olimpyx/web -- --host 127.0.0.1 > /tmp/olimpyx-web.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4300/health/ready && break; sleep 1; done
          curl --fail --silent --show-error http://127.0.0.1:4300/health/ready
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          curl --fail --silent --show-error http://127.0.0.1:5173/ >/dev/null
      - run: npm run test:smoke
      - run: OLIMPYX_URL=http://127.0.0.1:4300 npm run test:live -w @olimpyx/client
      - run: OLIMPYX_URL=http://127.0.0.1:4300 npm run test:live-cli -w @olimpyx/client
      - run: npm run test:load
      - run: npm run test:expiry
      - run: npm run test:e2e
      - name: Collect service logs
        if: failure()
        run: |
          mkdir -p test-artifacts
          cp /tmp/olimpyx-api.log test-artifacts/api.log 2>/dev/null || true
          cp /tmp/olimpyx-web.log test-artifacts/web.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-artifacts/
          if-no-files-found: ignore
