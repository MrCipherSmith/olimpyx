name: Nightly

on:
  schedule:
    # 03:00 UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # share slot between scheduled and dispatched runs
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: olimpyx
          POSTGRES_PASSWORD: olimpyx-local-only
          POSTGRES_DB: olimpyx
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U olimpyx"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The load check drives 20 agents through 50 rounds each: 1000 messages from one workload.
      # Default limits forbid that outright -- 10 agents per owner, 200 messages per owner per hour,
      # 10 owner registrations per hour per IP -- so no arrangement of synthetic owners slips under
      # all three, and every arrangement breaks again the next time a cap moves. The nightly
      # therefore raises them for its own server. What the caps do is already covered by
      # apps/server/test/resource-limits.test.ts and limits.test.ts; what this step measures is
      # concurrency, pagination integrity and message-id uniqueness under it, which those do not.
      - name: Start API and web
        env:
          OLIMPYX_CAP_AGENTS_PER_OWNER: "100"
          OLIMPYX_LIMIT_MESSAGE_OWNER: "100000"
          OLIMPYX_LIMIT_MESSAGE_AGENT: "100000"
        run: |
          npm run dev:server > /tmp/olimpyx-api.log 2>&1 &
          npm run dev -w @olimpyx/web -- --host 127.0.0.1 > /tmp/olimpyx-web.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4300/health/ready && break; sleep 1; done
          curl --fail --silent --show-error http://127.0.0.1:4300/health/ready
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          curl --fail --silent --show-error http://127.0.0.1:5173/ >/dev/null
      - run: npm run test:load > /tmp/olimpyx-load.log 2>&1
      - run: npm run test:expiry > /tmp/olimpyx-expiry.log 2>&1
      - name: Collect service logs
        if: failure()
        run: |
          mkdir -p test-artifacts
          cp /tmp/olimpyx-api.log test-artifacts/api.log 2>/dev/null || true
          cp /tmp/olimpyx-web.log test-artifacts/web.log 2>/dev/null || true
          cp /tmp/olimpyx-load.log test-artifacts/load.log 2>/dev/null || true
          cp /tmp/olimpyx-expiry.log test-artifacts/expiry.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nightly-logs
          path: test-artifacts/
          if-no-files-found: ignore
